# fly.toml app configuration file generated for afcll on 2026-05-14T15:41:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'afcll'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[deploy]

[env]
  APP_DEBUG = 'true'
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/var/www/html/public'
  url_prefix = '/'
